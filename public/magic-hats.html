<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DILI WONKA — MAGIC HATS</title><style>
:root{font-family:ui-monospace,monospace;color:#fff2b0;background:#16091e}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#6a2753,#16091e 65%)}main{width:min(680px,100%);padding:24px;text-align:center}a{color:#ffe06d}.topbar{position:fixed;z-index:3;top:18px;left:20px;display:flex;align-items:center;gap:16px;color:#ffe06d;font-size:.76rem}.rules{font-size:.76rem;color:#f5dc9a}.board{display:flex;justify-content:center;align-items:center;gap:clamp(14px,6vw,48px);margin:30px auto 20px;padding:40px 15px;border:1px solid #b67c27;border-radius:12px;background:linear-gradient(#37142d,#18091f);overflow:hidden}.slot{width:clamp(76px,22vw,126px)}.hat{position:relative;width:100%;aspect-ratio:1/.78;border:0;border-radius:50% 50% 14px 14px;background:linear-gradient(100deg,#d84c52,#7a152a 55%,#3e0814);box-shadow:inset 12px 0 #ff8b75,inset -13px 0 #4a0818,0 12px 0 #420e1a;cursor:pointer;transition:transform .18s,filter .18s;will-change:transform}.hat:before{content:'';position:absolute;left:-12%;right:-12%;bottom:-14%;height:22%;border-radius:50%;background:linear-gradient(#ff786b,#781127);box-shadow:0 5px 0 #400916}.hat:hover:not(:disabled){filter:brightness(1.16)}.hat:disabled{cursor:not-allowed}.hat.ball:after{content:'';position:absolute;z-index:-1;left:42%;bottom:-34%;width:21%;aspect-ratio:1;border-radius:50%;background:#ffe85c;box-shadow:0 0 16px #ffe85c}.hat.reveal{filter:brightness(1.4);transform:translateY(-18px)!important}.hat.reveal:after{z-index:2}.controls{margin-bottom:14px;display:flex;justify-content:center;gap:8px;align-items:center;flex-wrap:wrap}.controls label{font-size:.78rem}.controls input{width:110px;padding:12px;border:1px solid #f3cf60;border-radius:5px;background:#211025;color:#fff2b0;font:inherit}button.play{font:inherit;border:1px solid #ffe887;border-radius:5px;padding:13px 18px;background:linear-gradient(#ffe887,#d69a22 55%,#8d4b0c);box-shadow:0 3px 0 #4d2207;color:#351507;cursor:pointer;transition:transform .16s,filter .16s}button.play:hover:not(:disabled),button:hover{transform:translateY(-2px);filter:brightness(1.1)}button.play:active,button:active{transform:translateY(2px)}button:disabled{opacity:.55}.log{min-height:46px;margin-top:18px;color:#ffe06d;letter-spacing:.05em}.tier{margin:14px 0;font-size:.71rem;color:#f0d391}@media(max-width:480px){main{padding:16px}.board{gap:20px;padding-left:8px;padding-right:8px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}}@view-transition{navigation:auto}@media(prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation-duration:0.01ms}}</style></head><body><main><div class="topbar"><span>🪙 BALANCE <b id="coin">0</b> COIN</span><a href="/">← LOBBY</a></div><h1>MAGIC HATS</h1><p class="rules">BET LOCKS BEFORE SHUFFLE. BALL STAYS HIDDEN UNTIL YOU PICK.</p><div class="tier">EASY 1-49: +50% · MEDIUM 50-100: +100% · HARD 101+: +200%</div><div class="board"><span class="slot" data-slot="0"><button class="hat" aria-label="Hat 1"></button></span><span class="slot" data-slot="1"><button class="hat" aria-label="Hat 2"></button></span><span class="slot" data-slot="2"><button class="hat" aria-label="Hat 3"></button></span></div><div class="controls"><label>BET <input id="bet" type="number" min="1" step="1" value="20"></label></div><button class="play" id="start">SHUFFLE HATS</button><div class="log" id="log" role="status" aria-live="polite">SET BET. START ROUND.</div></main><script>
const $=id=>document.getElementById(id),slots=[...document.querySelectorAll('.slot')];let phase='idle',busy=false;
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const x=await r.json();if(!r.ok)throw Error(x.error||'request_failed');return x}
function sound(kind){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=kind==='win'?660:kind==='lose'?130:340;g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.15);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.15)}
function hats(){return slots.map(s=>s.firstElementChild)}function lock(value){hats().forEach(h=>h.disabled=value);$('start').disabled=value;$('bet').disabled=value}function ballAt(slot){hats().forEach((h,i)=>h.classList.toggle('ball',i===slot))}
async function swap(a,b,ms){const ha=slots[a].firstElementChild,hb=slots[b].firstElementChild,ra=ha.getBoundingClientRect(),rb=hb.getBoundingClientRect();ha.style.transition=`transform ${ms}ms ease-in-out`;hb.style.transition=`transform ${ms}ms ease-in-out`;ha.style.transform=`translateX(${rb.left-ra.left}px)`;hb.style.transform=`translateX(${ra.left-rb.left}px)`;await new Promise(r=>setTimeout(r,ms+35));slots[a].append(hb);slots[b].append(ha);ha.style.transition=hb.style.transition='';ha.style.transform=hb.style.transform=''}
async function watch(moves,stepMs){const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;stepMs=calm?0:stepMs;$('log').textContent='SHUFFLING...';for(const [a,b] of moves){await swap(a,b,stepMs);if(!calm)sound('move')}}
function bindHats(){hats().forEach((hat,index)=>hat.onclick=()=>pick(index))}
async function load(){const x=await api('/api/magic-hats');$('coin').textContent=x.coin;if(x.round){$('log').textContent='ROUND ACTIVE. PICK A HAT.';phase='pick';lock(false);$('start').disabled=true;$('bet').disabled=true;bindHats()}else lock(false)}
async function start(){if(busy||phase!=='idle')return;const wager=Number($('bet').value);if(!Number.isInteger(wager)||wager<1){$('log').textContent='BET MUST BE WHOLE COIN.';return}busy=true;lock(true);try{const x=await api('/api/magic-hats','POST',{wager});$('coin').textContent-=wager;await watch(x.moves,x.stepMs);phase='pick';busy=false;hats().forEach(h=>h.disabled=false);bindHats();$('log').textContent='PICK A HAT'}catch(e){$('log').textContent=e.message;phase='idle';busy=false;lock(false)}}
async function pick(index){if(busy||phase!=='pick')return;busy=true;lock(true);try{const x=await api('/api/magic-hats/guess','POST',{hat:index});ballAt(x.hat);const hat=hats()[x.hat];hat.classList.add('reveal');sound(x.win?'win':'lose');$('coin').textContent=x.coin;$('log').textContent=x.win?`WIN +${x.payout-x.wager} PROFIT. PAID ${x.payout}.`:`LOSE. BALL UNDER HAT ${x.hat+1}.`;phase='idle';setTimeout(()=>{hat.classList.remove('reveal');hats().forEach(h=>{h.classList.remove('ball');h.style.transform='' });lock(false);$('start').disabled=false;busy=false;bindHats()},1100)}catch(e){$('log').textContent=e.message;busy=false;lock(false)}}
$('start').onclick=start;bindHats();load().catch(e=>{$('log').textContent=e.message});
</script></body></html>
