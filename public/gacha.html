<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DILI WONKA — GACHA</title><style>
:root{font-family:ui-monospace,monospace;color:#fff2b0;background:#241124}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#9e3f73,#241124 65%)}main{max-width:640px;padding:8px 24px 24px;text-align:center}a{color:#ffd44d}h1{margin-top:10px;color:#ffd44d;letter-spacing:.12em}.machine{border:4px solid #ffd44d;border-radius:50%;width:230px;height:230px;margin:25px auto;display:grid;place-items:center;background:conic-gradient(#ffda45,#e64d85,#7a2d91,#ffda45);font-size:4rem}.machine span{background:#241124;border-radius:50%;width:150px;height:150px;display:grid;place-items:center}.machine.roll{animation:roll .6s linear}.coin,.tickets{color:#ffd44d}button{font:inherit;background:#ffd44d;border:0;padding:14px;color:#241124;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.log{min-height:50px;color:#fff2b0}@keyframes roll{to{transform:rotate(720deg)}}
button{position:relative;overflow:hidden;border:1px solid #ffe994;border-radius:5px;background:linear-gradient(180deg,#ffe887,#d69a22 52%,#8d4b0c);box-shadow:0 3px 0 #4d2207,0 0 16px #ffd44d55;text-shadow:0 1px #fff6b0;color:#351507;transition:transform .16s,filter .16s,box-shadow .16s}button:hover{transform:translateY(-2px);filter:brightness(1.12);box-shadow:0 5px 0 #4d2207,0 0 26px #ffd44d88}button:active{transform:translateY(2px);box-shadow:0 1px 0 #4d2207}.machine{box-shadow:0 0 28px #ffd44d66}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}@media(max-height:740px){body{place-items:start center;padding-top:12px}.machine{width:190px;height:190px;margin:18px auto 16px}.machine span{width:124px;height:124px;font-size:3.2rem}}@view-transition{navigation:auto}@media(prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation-duration:0.01ms}}</style></head><body><main><a href="/">← LOBBY</a><h1>GACHA FACTORY</h1><p>Up to 1% Golden Ticket chance while Tickets remain. 10 total. Price increases per Ticket found.</p><div class="coin">BALANCE <b id="coin">0</b> COIN</div><div class="tickets">GOLDEN TICKETS <b id="found">0</b> / 10</div><div class="machine" id="machine"><span>?</span></div><div class="log" id="log" role="status" aria-live="polite">READY</div><button id="roll">NEXT ROLL</button></main><script>
const $=id=>document.getElementById(id);let busy=false,cost=1000;const label=()=>$('roll').textContent='ROLL — '+cost+' COIN';async function api(path,method='GET'){const r=await fetch(path,{method});const x=await r.json();if(!r.ok)throw Error(x.error||'request_failed');return x}async function load(){const [me,tickets]=await Promise.all([api('/api/me'),api('/api/tickets')]);if(!me.user?.xVerified){$('log').innerHTML='<a href="/auth/x">LOGIN X TO ROLL</a>';$('roll').disabled=true;return}$('found').textContent=tickets.found;cost=tickets.cost;label();const r=await fetch('/api/fishing'),x=await r.json();$('coin').textContent=x.coin;$('roll').disabled=x.coin<cost||tickets.found>=10;if(tickets.found>=10)$('log').textContent='ALL TICKETS FOUND'}async function roll(){if(busy)return;busy=true;$('roll').disabled=true;$('machine').classList.add('roll');$('log').textContent='ROLLING...';try{const x=await api('/api/gacha','POST');$('coin').textContent=x.coin;$('found').textContent=x.found;cost=x.cost;label();$('log').textContent=x.event.kind.replaceAll('_',' ').toUpperCase()+(x.event.value?' +'+x.event.value+' COIN':'')}catch(e){$('log').textContent=e.message}finally{$('machine').classList.remove('roll');busy=false;load()}}$('roll').onclick=roll;load().catch(e=>{$('log').textContent=e.message})
</script></body></html>
