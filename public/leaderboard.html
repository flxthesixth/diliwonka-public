<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DILI WONKA — LEADERBOARD</title><style>
:root{font-family:ui-monospace,monospace;color:#fff2b0;background:#170926}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#72234e,#170926 65%)}main{max-width:680px;margin:auto;padding:24px}a{color:#ffd44d}h1{color:#ffd44d;letter-spacing:.14em;text-align:center}.sub{text-align:center;color:#d8bfd8}.board{margin:18px 0 30px;border:1px solid #ffd44d;background:#28113b}.row{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:12px;padding:15px;border-bottom:1px solid #542343;align-items:center}.row .name{overflow-wrap:anywhere}.row:last-child{border:0}.rank,.coin{color:#ffd44d}.profile{color:#fff2b0;text-decoration:none}.profile:hover{color:#ffd44d}.verified{font-size:.7rem;color:#a9edff}.empty{text-align:center;padding:32px;color:#d8bfd8}
a,button{position:relative;overflow:hidden;border:1px solid #ffe994;border-radius:4px;background:linear-gradient(180deg,#ffe887,#d69a22 52%,#8d4b0c);box-shadow:0 3px 0 #4d2207,0 0 14px #ffd44d33;text-shadow:0 1px #fff6b0;color:#351507;transition:transform .16s,filter .16s,box-shadow .16s}a:hover,button:hover{transform:translateY(-2px);filter:brightness(1.12);box-shadow:0 5px 0 #4d2207,0 0 22px #ffd44d66}a:active,button:active{transform:translateY(2px);box-shadow:0 1px 0 #4d2207}.profile{background:none;border:0;box-shadow:none;color:#fff2b0;text-shadow:none}.profile:hover{box-shadow:none;color:#ffd44d}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}@view-transition{navigation:auto}@media(prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation-duration:0.01ms}}</style></head><body><main><a href="/">← LOBBY</a><h1>LEADERBOARD</h1><p class="sub">TOP 10 COIN HOLDERS</p><section class="board" id="coins"><div class="empty">LOADING...</div></section><p class="sub">GOLDEN TICKET HOLDERS</p><section class="board" id="tickets"><div class="empty">LOADING...</div></section></main><script>const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const profile=p=>p.xVerified?`<a class="profile" target="_blank" rel="noopener noreferrer" href="https://x.com/${encodeURIComponent(p.username)}">@${esc(p.username)}</a> <small class="verified">X VERIFIED</small>`:`@${esc(p.username)}`;const board=(id,rows,render)=>document.querySelector(id).innerHTML=rows.length?rows.map(render).join(''):'<div class="empty">NO PLAYERS YET</div>';fetch('/api/leaderboard').then(r=>r.json()).then(({players,ticketHolders})=>{board('#coins',players,(p,i)=>`<div class="row"><b class="rank">#${i+1}</b><span>${profile(p)}</span><b class="coin">${p.coin} COIN</b></div>`);board('#tickets',ticketHolders,(p,i)=>`<div class="row"><b class="rank">#${i+1}</b><span><a class="profile" target="_blank" rel="noopener noreferrer" href="https://x.com/${encodeURIComponent(p.username)}">@${esc(p.username)}</a> <small class="verified">X VERIFIED</small></span><b class="coin">TICKET</b></div>`)}).catch(()=>{document.querySelector('#coins').innerHTML=document.querySelector('#tickets').innerHTML='<div class="empty">UNAVAILABLE</div>'})</script></body></html>
