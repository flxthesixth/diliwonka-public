<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DILI WONKA — MAGIC DOORS</title><style>
:root{font-family:ui-monospace,monospace;color:#fff2b0;background:#15061e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#10051db3,#10051de6),url('/assets/DILI%20WONKA%20FACTORY.webp') center/cover fixed}main{min-height:100vh;display:flex;flex-direction:column;padding:20px;max-width:900px;margin:auto}a{color:#ffd44d}.topbar{position:fixed;z-index:3;top:18px;left:20px;display:flex;align-items:center;gap:24px;font-size:.76rem}.balance{padding:8px 11px;border:1px solid #ffe887;border-radius:5px;background:#170a22cf;box-shadow:inset 0 0 8px #ffd44d24}.stage{flex:1;display:grid;place-items:center}.game-stack{display:flex;flex-direction:column;gap:12px;width:100%}.head{text-align:center;margin:0}.head{order:1}.head h1{margin:0;color:#ffd44d;font-size:clamp(2rem,6vw,4rem);line-height:1;letter-spacing:.12em}.rules{font-size:.72rem;color:#f4d993}.level{margin:18px 0 8px;color:#ffe887;font-size:.82rem;letter-spacing:.16em}.run-status{margin-bottom:14px;color:#f4d993;font-size:.72rem;letter-spacing:.12em}.doors{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:center;justify-items:center}.door{aspect-ratio:2/3;width:100%;height:auto;max-height:min(28vh,220px);padding:0;border:0;background:transparent;cursor:pointer}.door img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 8px #08020c99);transition:transform .2s,filter .2s}.door:hover:not(:disabled) img{transform:translateY(-4px) scale(1.02);filter:drop-shadow(0 12px 14px #08020ccc) brightness(1.1)}.door:disabled{cursor:not-allowed}.door.open img{filter:brightness(.7)}.log{order:3;min-height:50px;margin:18px auto 0;max-width:560px;padding:13px;text-align:center;border:1px solid #8a5a24;background:#170a22cf;color:#ffd44d;font-size:.8rem;letter-spacing:.05em}.actions{order:4;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.actions[hidden]{display:none}button.action{font:inherit;border:1px solid #ffe887;border-radius:5px;padding:13px 18px;background:linear-gradient(#ffe887,#d69a22 55%,#8d4b0c);box-shadow:0 3px 0 #4d2207;color:#351507;cursor:pointer;transition:transform .16s}button.action:hover,button:hover{transform:translateY(-2px)}button.action:active,button:active{transform:translateY(2px)}@media(max-width:580px){main{padding:14px}.doors{gap:5px}.topbar{top:14px;left:14px;font-size:.63rem}.actions{display:grid}.action{width:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}}@view-transition{navigation:auto}@media(prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation-duration:0.01ms}}</style></head><body><main><div class="topbar"><span class="balance">🪙 TOTAL <b id="total">0</b></span><a href="/">← LOBBY</a></div><section class="stage"><div class="game-stack"><section class="head"><h1>MAGIC DOORS</h1><p class="rules">ENTRY 20 · REWARD 50×LEVEL · TRAP −25×LEVEL · 10 LEVELS</p><div class="level" id="levelStatus">LEVEL 1 / 10</div><div class="run-status">RUN <b id="coin">0</b></div><div class="doors" id="doors"></div><div class="log" id="log" role="status" aria-live="polite">CHOOSE ONE DOOR</div></section><div class="actions" id="actions" hidden><button class="action" id="deeper">GO DEEPER</button><button class="action" id="claim" hidden>CLAIM REWARD</button><button class="action" id="leave">LEAVE WITH COIN</button></div></div></section></main><script>
const $=id=>document.getElementById(id);let state,busy=false;
async function api(path,method='GET',body){let r;try{r=await fetch(path,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined})}catch(e){throw Error('CONNECTION ERROR — TRY AGAIN')}const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch(e){data={error:text||`HTTP ${r.status}`}}if(!r.ok)throw Error(data.error||`HTTP ${r.status}`);return data}
function sound(kind){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=kind==='win'?620:130;g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.18)}
function lock(value){document.querySelectorAll('.door').forEach(b=>b.disabled=value||!!state?.resolved);$('deeper').disabled=value;$('claim').disabled=value;$('leave').disabled=value}function renderActions(gained){const max=state.resolved&&state.level===10;$('actions').hidden=!state.resolved;$('deeper').hidden=max;$('claim').hidden=!max;if(state.resolved){const next=max?'Claim your reward.':'Go deeper or leave with Coin.';$('log').textContent=gained==null?next:`+${gained} Coin. ${next}`}}function draw(){$('levelStatus').textContent=`LEVEL ${state.level} / 10`;$('coin').textContent=state.runCoin;const box=$('doors');box.innerHTML='';for(let i=0;i<5;i++){const b=document.createElement('button');b.className='door';b.disabled=!!state.resolved;b.ariaLabel=`Magic door ${i+1}`;b.innerHTML='<img src="/assets/DOOR.webp" alt="">';b.onclick=()=>open(i,b);box.append(b)}$('log').textContent=state.resolved?'':'CHOOSE ONE DOOR';renderActions()}
async function balance(){const x=await api('/api/magic-hats');$('total').textContent=x.coin}
async function open(door,button){if(busy)return;busy=true;button.classList.add('open');$('log').textContent='OPENING...';try{const x=await api('/api/dungeon/door','POST',{door});state=x.state;state.resolved=1;button.querySelector('img').src=x.event.kind==='trap'?'/assets/DOOR%20TRAP.webp':'/assets/DOOR%20COIN.webp';sound(x.event.kind==='coin'?'win':'lose');$('log').textContent=x.event.kind==='trap'?`TRAP — LOST RUN. −${x.event.penalty} TOTAL COIN.`:`FOUND ${x.event.gained} RUN COIN.`;if(x.event.ended)setTimeout(load,1100);else {renderActions(x.event.gained);await balance()}}catch(e){$('log').textContent=e.message}finally{busy=false}}
async function load(){[state]=await Promise.all([api('/api/dungeon'),balance()]);busy=false;draw()}
$('deeper').onclick=async()=>{if(busy)return;busy=true;try{state=await api('/api/dungeon/deeper','POST');draw()}catch(e){$('log').textContent=e.message}finally{busy=false}};$('claim').onclick=async()=>{if(busy)return;busy=true;lock(true);try{const x=await api('/api/dungeon/claim','POST');$('log').textContent=`CLAIMED ${x.claimed} COIN. SEE YOU.`;setTimeout(()=>location.href='/',700)}catch(e){$('log').textContent=e.message;busy=false;lock(false)}};$('leave').onclick=async()=>{if(busy)return;busy=true;lock(true);try{const x=await api('/api/dungeon/leave','POST');$('log').textContent=`SAVED ${x.saved} COIN. BACK TO LOBBY.`;setTimeout(()=>location.href='/',600)}catch(e){$('log').textContent=e.message;busy=false;lock(false)}};load().catch(e=>{$('log').textContent=e.message});
</script></body></html>
